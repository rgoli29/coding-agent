[project]
name = "coding-agent"
version = "0.1.0"
description = "A SWE-bench coding agent: native LLM gateway + containerized runner/agent."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "datasets>=2.19",
    "swebench>=3.0",
]

[project.optional-dependencies]
# Approach B (M5). Not installed by default.
graph = ["langgraph>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
